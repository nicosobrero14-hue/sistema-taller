spring.application.name=usuarios-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/usuarios-service?serverTimezone=UTC
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}

# El esquema lo maneja flyway (src/main/resources/db/migration).
# Hibernate no lo toca: update no sabe borrar ni cambiar un enum.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true

# se registra en el eureka-server
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

servicios.taller.url=http://taller-service

# firma de los tokens. En produccion esto va en una variable de entorno,
# no en el archivo: el que tenga el secreto puede fabricar tokens validos.
jwt.secreto=${JWT_SECRETO}
jwt.horas-validez=12
