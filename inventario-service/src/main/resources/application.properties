spring.application.name=inventario-service
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/inventario-service?serverTimezone=UTC
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}

# El esquema lo maneja flyway (src/main/resources/db/migration).
# Hibernate no lo toca: update no sabe borrar ni cambiar un enum.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true

# se registra en el eureka-server
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
