spring.application.name=taller-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/taller-service?serverTimezone=UTC
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}

# El esquema lo maneja flyway (src/main/resources/db/migration).
# Hibernate no lo toca: update no sabe borrar ni cambiar un enum.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true

servicios.usuarios.url=http://usuarios-service
servicios.clientes.url=http://clientes-service

# se registra en el eureka-server
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
servicios.inventario.url=http://inventario-service

# donde se guardan las fotos de las ordenes
app.fotos.carpeta=./fotos-ordenes
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
