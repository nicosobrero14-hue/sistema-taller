spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# lb:// significa "buscalo en eureka por nombre y balancealo"

spring.cloud.gateway.server.webmvc.routes[0].id=usuarios-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://usuarios-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/sucursales/**,/empleados/**,/auth/**,/configuracion/**

spring.cloud.gateway.server.webmvc.routes[1].id=clientes-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://clientes-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/clientes/**,/vehiculos/**

spring.cloud.gateway.server.webmvc.routes[2].id=taller-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://taller-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/ordenes/**,/items/**,/fotos/**,/presupuestos/**

spring.cloud.gateway.server.webmvc.routes[3].id=inventario-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://inventario-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/repuestos/**,/movimientos/**

# Tiene que ser el mismo secreto que usa usuarios-service para firmar.
# En produccion se define la variable de entorno JWT_SECRETO en los dos
# servicios y el valor de abajo no se usa nunca.
jwt.secreto=${JWT_SECRETO}

spring.cloud.gateway.server.webmvc.routes[4].id=pagos-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://pagos-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/pagos/**

spring.cloud.gateway.server.webmvc.routes[5].id=ventas-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://ventas-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/ventas/**
